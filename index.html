
<!DOCTYPE html>
< lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050810">
  <title>DEE AI 2.0</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050810;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      padding: 25px;
      max-width: 600px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #48c6ef;
    }

    .status {
      color: #42e695;
      font-size: 12px;
    }

    .core {
      text-align: center;
      margin-top: 100px;
    }

    .orb {
      width: 160px;
      height: 160px;
      margin: auto;
      border-radius: 50%;
      background: radial-gradient(circle, #48c6ef, #182848 65%, #050810);
      box-shadow: 0 0 50px #168cbb66;
    }

    h1 {
      margin-top: 30px;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 12px;
      color: #8995a8;
    }

    .chat {
      margin-top: 80px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #25364b;
      background: #101827;
      color: white;
      outline: none;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #168cbb;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<>
  < class="app">
    <header class="header">
      <div class="logo">DEE AI</div>
      <div class="status">● SYSTEM ONLINE</div>
    </header>

    <main class="core">
      <div class="orb"></div>
      <h1>I'm DEE.</h1>
      <p class="subtitle">Your personal AI assistant.</p>
    </main>

    
    <div id="messages" style="margin-top:40px;"></div>

    <div class="chat">
      <input id="userInput" type="text" placeholder="Talk to DEE...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");
      const message = input.value.trim();

      if (!message) return;

      const userMessage = document.createElement("p");
      userMessage.textContent = "YOU: " + message;
      userMessage.style.cssText =
        "background:#101827;padding:15px;border-radius:12px;margin-bottom:10px;";

      messages.appendChild(userMessage);

const reply = document.createElement("p");

reply.style.cssText =
  "background:#142638;padding:15px;border-radius:12px;margin-bottom:10px;color:#48c6ef;";

messages.appendChild(reply);
const aiReply = document.createElement("p");
aiReply.textContent = "DEE: Thinking...";
messages.appendChild(aiReply);

try {
    const response = await fetch("https://reducing-fighting-homepage-joyce.trycloudflare.com/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    const data = await response.json();
    aiReply.textContent = "DEE: " + (data.reply || data.error || "No response");
} catch (error) {
    aiReply.textContent = "DEE: Connection failed. Check that my server is running.";
    }
input.value = "";
    }
  </script>
</body>
</html>
